spring.application.name=learnhub-api

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.time-zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
app.db-session-time-zone=${DB_SESSION_TIME_ZONE:+07:00}
spring.datasource.hikari.connection-init-sql=SET time_zone = '${app.db-session-time-zone}'
spring.jpa.properties.hibernate.jdbc.time_zone=${app.time-zone}
spring.jackson.time-zone=${app.time-zone}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

spring.task.execution.pool.core-size=${ASYNC_CORE_POOL_SIZE:8}
spring.task.execution.pool.max-size=${ASYNC_MAX_POOL_SIZE:2147483647}
spring.task.execution.pool.queue-capacity=${ASYNC_QUEUE_CAPACITY:2147483647}
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000
app.auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE}
app.auth.refresh-cookie-same-site=${AUTH_REFRESH_COOKIE_SAME_SITE}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
spring.cache.type=caffeine

app.auth-cache.maximum-size=${AUTH_CACHE_MAXIMUM_SIZE:20000}
app.auth-cache.expire-after-write-minutes=${AUTH_CACHE_EXPIRE_AFTER_WRITE_MINUTES:15}
app.auth-cache.generation-extra-ttl-minutes=${AUTH_CACHE_GENERATION_EXTRA_TTL_MINUTES:5}
app.video-playback-cache.metadata-maximum-size=${VIDEO_PLAYBACK_CACHE_METADATA_MAXIMUM_SIZE:10000}
app.video-playback-cache.metadata-expire-after-write-minutes=${VIDEO_PLAYBACK_CACHE_METADATA_TTL_MINUTES:30}
app.video-playback-cache.access-maximum-size=${VIDEO_PLAYBACK_CACHE_ACCESS_MAXIMUM_SIZE:50000}
app.video-playback-cache.access-expire-after-write-minutes=${VIDEO_PLAYBACK_CACHE_ACCESS_TTL_MINUTES:5}

app.cache.role-ids.maximum-size=${APP_CACHE_ROLE_IDS_MAXIMUM_SIZE:32}
app.cache.role-ids.expire-after-write=${APP_CACHE_ROLE_IDS_EXPIRE_AFTER_WRITE:24h}
app.cache.categories.maximum-size=${APP_CACHE_CATEGORIES_MAXIMUM_SIZE:4}
app.cache.categories.expire-after-write=${APP_CACHE_CATEGORIES_EXPIRE_AFTER_WRITE:12h}
app.cache.admin-overview.maximum-size=${APP_CACHE_ADMIN_OVERVIEW_MAXIMUM_SIZE:2}
app.cache.admin-overview.expire-after-write=${APP_CACHE_ADMIN_OVERVIEW_EXPIRE_AFTER_WRITE:1m}
app.cache.admin-time-series.maximum-size=${APP_CACHE_ADMIN_TIME_SERIES_MAXIMUM_SIZE:256}
app.cache.admin-time-series.expire-after-write=${APP_CACHE_ADMIN_TIME_SERIES_EXPIRE_AFTER_WRITE:2m}
app.cache.instructor-overview.maximum-size=${APP_CACHE_INSTRUCTOR_OVERVIEW_MAXIMUM_SIZE:2000}
app.cache.instructor-overview.expire-after-write=${APP_CACHE_INSTRUCTOR_OVERVIEW_EXPIRE_AFTER_WRITE:1m}
app.cache.instructor-time-series.maximum-size=${APP_CACHE_INSTRUCTOR_TIME_SERIES_MAXIMUM_SIZE:4000}
app.cache.instructor-time-series.expire-after-write=${APP_CACHE_INSTRUCTOR_TIME_SERIES_EXPIRE_AFTER_WRITE:2m}
app.cache.query-embeddings.maximum-size=${APP_CACHE_QUERY_EMBEDDINGS_MAXIMUM_SIZE:500}
app.cache.query-embeddings.expire-after-write=${APP_CACHE_QUERY_EMBEDDINGS_EXPIRE_AFTER_WRITE:24h}
app.cache.course-rating-stats.maximum-size=${APP_CACHE_COURSE_RATING_STATS_MAXIMUM_SIZE:10000}
app.cache.course-rating-stats.expire-after-write=${APP_CACHE_COURSE_RATING_STATS_EXPIRE_AFTER_WRITE:30m}
app.cache.course-rating-summaries.maximum-size=${APP_CACHE_COURSE_RATING_SUMMARIES_MAXIMUM_SIZE:10000}
app.cache.course-rating-summaries.expire-after-write=${APP_CACHE_COURSE_RATING_SUMMARIES_EXPIRE_AFTER_WRITE:30m}
app.cache.instructor-rating-stats.maximum-size=${APP_CACHE_INSTRUCTOR_RATING_STATS_MAXIMUM_SIZE:5000}
app.cache.instructor-rating-stats.expire-after-write=${APP_CACHE_INSTRUCTOR_RATING_STATS_EXPIRE_AFTER_WRITE:30m}
app.cache.public-course-details.maximum-size=${APP_CACHE_PUBLIC_COURSE_DETAILS_MAXIMUM_SIZE:2000}
app.cache.public-course-details.expire-after-write=${APP_CACHE_PUBLIC_COURSE_DETAILS_EXPIRE_AFTER_WRITE:2h}
app.cache.public-instructor-profiles.maximum-size=${APP_CACHE_PUBLIC_INSTRUCTOR_PROFILES_MAXIMUM_SIZE:2000}
app.cache.public-instructor-profiles.expire-after-write=${APP_CACHE_PUBLIC_INSTRUCTOR_PROFILES_EXPIRE_AFTER_WRITE:30m}
app.cache.public-course-catalog.maximum-size=${APP_CACHE_PUBLIC_COURSE_CATALOG_MAXIMUM_SIZE:32}
app.cache.public-course-catalog.expire-after-write=${APP_CACHE_PUBLIC_COURSE_CATALOG_EXPIRE_AFTER_WRITE:1m}

app.sse.timeout-ms=${APP_SSE_TIMEOUT_MS:1800000}
app.sse.heartbeat-ms=${APP_SSE_HEARTBEAT_MS:15000}
app.scheduler.session-cleanup-delay-ms=${SESSION_CLEANUP_DELAY_MS:3600000}
app.scheduler.payment-expiration-scan-delay-ms=${PAYMENT_EXPIRATION_SCAN_DELAY_MS:300000}
app.hls.private-cache-max-age-seconds=${HLS_PRIVATE_CACHE_MAX_AGE_SECONDS:3600}

app.swagger.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${app.swagger.enabled}
springdoc.swagger-ui.enabled=${app.swagger.enabled}

app.pagination.default-page-size=12
app.pagination.max-page-size=100
app.stats.overview-period-days=30
app.stats.max-day-buckets=90
app.stats.max-month-buckets=120
app.stats.max-quarter-buckets=40
app.video.status-batch-limit=50

video.storage.provider=s3

video.max-size=2147483648

aws.s3.bucket-raw=${AWS_S3_BUCKET_RAW}
aws.s3.bucket-hls=${AWS_S3_BUCKET_HLS}
aws.s3.region=${AWS_REGION}
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.presigned-url.expiration=300
aws.mediaconvert.role-arn=${AWS_MEDIACONVERT_ROLE_ARN}

aws.client.connection-timeout=${AWS_CLIENT_CONNECTION_TIMEOUT:2s}
aws.client.api-call-attempt-timeout=${AWS_CLIENT_API_CALL_ATTEMPT_TIMEOUT:30s}
aws.client.api-call-timeout=${AWS_CLIENT_API_CALL_TIMEOUT:3m}
aws.client.max-attempts=${AWS_CLIENT_MAX_ATTEMPTS:4}

aws.sqs.video-events-queue-url=${AWS_SQS_VIDEO_EVENTS_QUEUE_URL}
aws.sqs.video-upload-events-queue-url=${AWS_SQS_VIDEO_UPLOAD_EVENTS_QUEUE_URL}

spring.cloud.aws.sqs.listener.auto-startup=${AWS_SQS_LISTENER_AUTO_STARTUP:true}
spring.cloud.aws.sqs.listener.max-concurrent-messages=${AWS_SQS_MAX_CONCURRENT_MESSAGES:1}
spring.cloud.aws.sqs.listener.max-messages-per-poll=${AWS_SQS_MAX_MESSAGES_PER_POLL:1}
spring.cloud.aws.sqs.listener.poll-timeout=${AWS_SQS_POLL_TIMEOUT_SECONDS:20}s

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

cloudinary.folder.root=learnhub
cloudinary.folder.avatar=avatar
cloudinary.folder.thumbnail=thumbnail

image.max-size=5242880
image.allowed-types=image/jpeg,image/png,image/webp

image.avatar.width=512
image.avatar.height=512
image.thumbnail.width=1280
image.thumbnail.height=720

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from-name=learnhub

app.verification.code-length=6
app.verification.expire-minutes=10
app.verification.resend-cooldown-seconds=60
app.verification.max-attempts=5

learnhub.quiz.pass-percent=70

momo.partnerCode=${MOMO_PARTNER_CODE}
momo.accessKey=${MOMO_ACCESS_KEY}
momo.secretKey=${MOMO_SECRET_KEY}
spring.http.serviceclient.momo.base-url=${MOMO_BASE_URL}
spring.http.serviceclient.momo.connect-timeout=5s
spring.http.serviceclient.momo.read-timeout=15s

app.payment.expire-minutes=15
momo.returnUrl=${MOMO_RETURN_URL}
momo.notifyUrl=${MOMO_NOTIFY_URL}

paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.environment=${PAYPAL_ENVIRONMENT}
paypal.return-url=${PAYPAL_RETURN_URL}
paypal.cancel-url=${PAYPAL_CANCEL_URL}
paypal.currency=${PAYPAL_CURRENCY}

spring.http.serviceclient.exchange-rate.base-url=${EXCHANGE_RATE_BASE_URL}
spring.http.serviceclient.exchange-rate.connect-timeout=5s
spring.http.serviceclient.exchange-rate.read-timeout=10s

app.password-reset.code-length=6
app.password-reset.expire-minutes=10
app.password-reset.resend-cooldown-seconds=60
app.password-reset.max-attempts=5

spring.jpa.properties.hibernate.generate_statistics=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.stat=OFF

spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.options.max-output-tokens=1024
spring.ai.google.genai.chat.options.thinking-level=MINIMAL
spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-2
spring.ai.google.genai.embedding.text.options.dimensions=${learnhub.ai.embedding-dimension}

learnhub.ai.max-history-messages=8
learnhub.ai.embedding-dimension=768
learnhub.ai.embedding-max-chars=24000

qdrant.enabled=true
qdrant.url=${QDRANT_URL}
qdrant.api-key=${QDRANT_API_KEY}
qdrant.collection=learnhub_courses_v1
qdrant.timeout=10

learnhub.vector.backfill-on-startup=${LEARNHUB_VECTOR_BACKFILL_ON_STARTUP:false}
learnhub.vector-search.candidate-limit=12
learnhub.recommendation.minimum-vector-score=0.82
learnhub.recommendation.semantic-weight=0.75
learnhub.recommendation.rating-prior=4.0
learnhub.recommendation.rating-prior-count=10
learnhub.recommendation.result-limit=6
learnhub.chat.course-limit=3
learnhub.chat.minimum-vector-score=0.65
