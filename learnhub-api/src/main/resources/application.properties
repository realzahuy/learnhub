spring.application.name=learnhub-api

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000
app.auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE}
app.auth.refresh-cookie-same-site=${AUTH_REFRESH_COOKIE_SAME_SITE}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.cache.type=simple
spring.cache.cache-names=roleIds

app.pagination.default-page-size=12
app.pagination.max-page-size=100

video.storage.provider=s3

video.max-size=2147483648

aws.s3.bucket-raw=${AWS_S3_BUCKET_RAW}
aws.s3.bucket-hls=${AWS_S3_BUCKET_HLS}
aws.s3.region=${AWS_REGION}
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.presigned-url.expiration=300
aws.mediaconvert.role-arn=${AWS_MEDIACONVERT_ROLE_ARN}

aws.sqs.video-events-queue-url=${AWS_SQS_VIDEO_EVENTS_QUEUE_URL}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

cloudinary.folder.root=learnhub
cloudinary.folder.avatar=avatar
cloudinary.folder.thumbnail=thumbnail

image.max-size=5242880
image.allowed-types=image/jpeg,image/png,image/webp

image.avatar.width=512
image.avatar.height=512
image.thumbnail.width=1280
image.thumbnail.height=720

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from-name=learnhub

app.verification.code-length=6
app.verification.expire-minutes=10
app.verification.resend-cooldown-seconds=60
app.verification.max-attempts=5

learnhub.quiz.pass-percent=70

momo.partnerCode=${MOMO_PARTNER_CODE}
momo.accessKey=${MOMO_ACCESS_KEY}
momo.secretKey=${MOMO_SECRET_KEY}
spring.http.serviceclient.momo.base-url=${MOMO_BASE_URL}
spring.http.serviceclient.momo.connect-timeout=5s
spring.http.serviceclient.momo.read-timeout=15s

app.payment.expire-minutes=15
momo.returnUrl=${MOMO_RETURN_URL}
momo.notifyUrl=${MOMO_NOTIFY_URL}

app.password-reset.code-length=6
app.password-reset.expire-minutes=10
app.password-reset.resend-cooldown-seconds=60
app.password-reset.max-attempts=5

spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai
vector.store.provider=qdrant
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.options.max-output-tokens=1024
spring.ai.google.genai.chat.options.thinking-level=MINIMAL
spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-2
spring.ai.google.genai.embedding.text.options.dimensions=768

learnhub.ai.max-history-messages=8
learnhub.ai.embedding-dimension=768
learnhub.ai.embedding-max-chars=24000

qdrant.enabled=true
qdrant.url=${QDRANT_URL}
qdrant.api-key=${QDRANT_API_KEY}
qdrant.collection=learnhub_courses_v1
qdrant.timeout=10

learnhub.vector.backfill-on-startup=false
learnhub.recommendation.vector-candidate-limit=30
learnhub.recommendation.minimum-vector-score=0.82
learnhub.recommendation.semantic-weight=0.75
learnhub.recommendation.rating-prior=4.0
learnhub.recommendation.rating-prior-count=10
learnhub.chat.vector-candidate-limit=12
learnhub.chat.course-limit=3
learnhub.chat.minimum-vector-score=0.72
